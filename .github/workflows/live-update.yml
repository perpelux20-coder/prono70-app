name: ProLab — mise à jour live

on:
  schedule:
    # Toutes les 15 minutes par défaut (tient dans le quota gratuit de 100 req/jour
    # d'API-Football, puisqu'un seul appel "live=all" récupère tous les matchs en direct).
    # Pour un vrai suivi quasi minute par minute (plan API-Football payant, 7500+ req/jour),
    # remplace la ligne ci-dessous par : "*/2 * * * *"  (toutes les 2 minutes)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live-update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer le moteur d'analyse live
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/live_update.py
