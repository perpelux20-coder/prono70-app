name: Mise à jour quotidienne des pronostics

on:
  schedule:
    # 06h00 UTC chaque jour (adapte l'heure si besoin — c'est l'heure UTC, pas locale)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permet de le lancer manuellement depuis l'onglet "Actions"
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer le moteur de récupération + prédiction
        run: python scripts/build_data.py

      - name: Publier les données mises à jour
        run: |
          git config user.name "football-app-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/*.json
          git diff --quiet --cached || git commit -m "Mise à jour automatique des données ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
